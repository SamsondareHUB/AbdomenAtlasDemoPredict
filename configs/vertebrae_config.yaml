# Basic config for vertebrae segmentation demo

model:
  name: SwinUNETR
  in_channels: 1
  out_channels: 25  # background + 24 vertebrae (adjust if your model uses a different number)
  feature_size: 48
  img_size: [96, 96, 96]
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]

inference:
  roi_size: [96, 96, 96]
  overlap: 0.25
  sw_batch_size: 1
  mode: gaussian

postprocessing:
  keep_largest_component: true
  morphological_smoothing: true
  fill_holes: true
